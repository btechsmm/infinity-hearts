# Render Blueprint: static site hosting for Infinity Hearts.
services:
  - type: web
    runtime: static
    name: infinity-hearts
    buildCommand: node scripts/build.mjs
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL          # public project URL, e.g. https://abcd.supabase.co
        sync: false
      - key: SUPABASE_ANON_KEY     # the PUBLISHABLE / anon key only. NEVER the service-role key.
        sync: false
      - key: VAPID_PUBLIC_KEY      # from `node scripts/gen-vapid.mjs`
        sync: false
    routes:
      - type: rewrite              # SPA fallback
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /config.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
